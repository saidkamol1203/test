<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axborot Tizimi Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Kunduzgi (Light) Rejam ranglari */
        :root {
            --bg-body: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-container: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --bg-input: #ffffff;
            --border-input: #dddddd;
            --bg-question: #f8f9fa;
            --border-question: #667eea;
            --bg-option: #ffffff;
            --border-option: #dddddd;
            --bg-option-hover: #f8f9fa;
            --bg-pagination: #ffffff;
            --bg-timer: #f0f0f0;
            --bg-detail-card: #f8f9fa;
            --shadow-container: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Tungi (Dark) Rejam ranglari */
        [data-theme="dark"] {
            --bg-body: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --bg-container: #2b2b3d;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --bg-input: #3a3a50;
            --border-input: #555577;
            --bg-question: #33334d;
            --border-question: #9fa8da;
            --bg-option: #33334d;
            --border-option: #555577;
            --bg-option-hover: #3f3f5c;
            --bg-pagination: #3a3a50;
            --bg-timer: #3a3a50;
            --bg-detail-card: #33334d;
            --shadow-container: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            background: var(--bg-container);
            color: var(--text-primary);
            border-radius: 15px;
            box-shadow: var(--shadow-container);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-question);
            border: 1px solid var(--border-option);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
        }

        .start-screen input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid var(--border-input);
            border-radius: 8px;
            font-size: 16px;
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .start-screen input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Test Screen */
        .test-screen {
            display: none;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s;
        }

        .question-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
            color: var(--text-secondary);
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }

        .page-item {
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border-option);
            background: var(--bg-pagination);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
        }

        .page-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .page-item.disabled {
            opacity: 0.45;
            cursor: default;
        }

        .test-screen,
        .test-screen * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .question-timer-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            background: var(--bg-timer);
            color: var(--text-primary);
        }

        .timer.warning {
            background: #fff3cd;
            color: #856404;
        }

        .timer.danger {
            background: #f8d7da;
            color: #721c24;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding: 20px;
            background: var(--bg-question);
            border-left: 4px solid var(--border-question);
            border-radius: 8px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 15px;
            border: 2px solid var(--border-option);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--bg-option);
            color: var(--text-primary);
        }

        .option:hover {
            border-color: #667eea;
            background: var(--bg-option-hover);
        }

        .option input[type="radio"] {
            margin-right: 10px;
        }

        .option label {
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .option.selected {
            border-color: #667eea;
            background: #e8eaf6;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
            color: #b71c1c;
        }

        .buttons-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }

        .btn-small {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
        }

        .btn-small:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Screen */
        .results-screen {
            display: none;
            text-align: center;
        }

        .results-screen h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 24px;
        }

        .score-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
        }

        .score-display .score-number {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-display .score-text {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .detail-card {
            background: var(--bg-detail-card);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .detail-card.correct { border-left-color: #4caf50; }
        .detail-card.incorrect { border-left-color: #f44336; }
        .detail-card.skipped { border-left-color: #ff9800; }

        .detail-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .detail-card.correct .detail-number { color: #4caf50; }
        .detail-card.incorrect .detail-number { color: #f44336; }
        .detail-card.skipped .detail-number { color: #ff9800; }

        .detail-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .group-results {
            margin-top: 40px;
            text-align: left;
        }

        .group-results h3 {
            color: var(--text-primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .group-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }

        .group-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-option);
            color: var(--text-primary);
        }

        .group-table tr:hover {
            background: var(--bg-option-hover);
        }

        .btn-restart {
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .start-screen input, .btn, .btn-small, .page-item, .question-timer-controls { width: 100%; }
            .page-item { min-width: 0; flex: 1 1 auto; }
            .score-details { grid-template-columns: 1fr; }
            .buttons-group { flex-direction: column; }
            .buttons-group .btn-small { width: 100%; }
            .header h1 { font-size: 22px; }
            .question-text { font-size: 16px; }
            .options { gap: 12px; }
            .option { padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Theme Toggle -->
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Tungi/Kunduzgi rejim">🌙</button>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <div class="header">
                <h1>🎓 Axborot Tizimi Testiga Hush Kelibsiz!</h1>
                <p>100 savoldan iborat sinov</p>
            </div>
            <div>
                <input type="text" id="userName" placeholder="Ismingizni kiriting" maxlength="50">
                <button class="btn" onclick="choosePartScreen()">Testni Boshlash</button>
                <button class="btn" style="margin-top: 10px; background: #999;" onclick="randomizeQuestions()">Savollarni Aralashtirish</button>
                <div id="shuffleStatus" style="margin-top: 10px; color: var(--text-secondary); font-size: 14px;"></div>
                <div id="groupNote" style="margin-top: 10px; color: var(--text-secondary); font-size: 14px;"></div>
            </div>
        </div>

        <!-- Test Screen -->
        <div class="test-screen" id="testScreen">
            <div class="header">
                <h1>Axborot Tizimi Test</h1>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="question-info">
                <span id="questionNumber">Savol 1/100</span>
                <div class="question-timer-controls">
                    <div class="timer" id="timer">15</div>
                    <button class="btn btn-small" onclick="togglePause()" id="pauseBtn">To'xtatish</button>
                </div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="pagination" id="pagination"></div>
            <div class="buttons-group">
                <button class="btn btn-small" onclick="previousQuestion()" id="prevBtn">Oldingi</button>
                <button class="btn btn-small" onclick="restartTest()" id="restartBtn" style="background: #ff6b6b;">Qayta Boshlash</button>
                <button class="btn btn-small" onclick="nextQuestion()" id="nextBtn">Keyingi →</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="results-screen" id="resultsScreen">
            <div class="header">
                <h1>🎉 Test Yakunlandi!</h1>
            </div>
            <h2 id="userNameDisplay"></h2>
            <div class="score-display">
                <div class="score-number" id="scoreNumber">0%</div>
                <div class="score-text" id="scoreText">0 / 100</div>
            </div>
            <div class="score-details">
                <div class="detail-card correct">
                    <div class="detail-number" id="correctCount">0</div>
                    <div class="detail-label">To'g'ri Javoblar</div>
                </div>
                <div class="detail-card incorrect">
                    <div class="detail-number" id="incorrectCount">0</div>
                    <div class="detail-label">Noto'g'ri Javoblar</div>
                </div>
                <div class="detail-card skipped">
                    <div class="detail-number" id="skippedCount">0</div>
                    <div class="detail-label">O'tkazib yuborilgan</div>
                </div>
            </div>
            <div class="group-results" id="groupResults" style="display:none;">
                <h3>Guruh Natijalariga</h3>
                <table class="group-table" id="groupTable"></table>
            </div>
            <div class="buttons-group" style="justify-content: center; gap: 15px;">
                <button class="btn btn-restart" onclick="restartTest()">Testni Qayta Boshlash</button>
                <button class="btn btn-restart" onclick="openNewStudentPanel()" style="background: #4caf50;">Yangi Talaba Qo'shish</button>
            </div>
        </div>
    </div>

    <script>
        // Arduino va Elektronika savollari
        const questions = [
            { q: "1. Arduino dasturida setup() funksiyasi qanday vazifani bajaradi?", options: ["Cheksiz ishlaydi", "Bir marta ishga tushadi", "Har sekundda ishlaydi", "Faqat sensorlarni o‘qiydi"], correct: 1 },
            { q: "2. Arduino dasturida loop() funksiyasi nima qiladi?", options: ["Bir marta ishlaydi", "Arduino o‘chadi", "Cheksiz takrorlanadi", "Faqat LED uchun ishlaydi"], correct: 2 },
            { q: "3. pinMode(13, OUTPUT); buyrug‘i nimani bildiradi?", options: ["13-pin kirish rejimida ishlaydi", "13-pin chiqish rejimida ishlaydi", "13-pin o‘chiriladi", "13-pin analog rejimda ishlaydi"], correct: 1 },
            { q: "4. digitalWrite(13, HIGH); buyrug‘i nima qiladi?", options: ["13-pinga kuchlanish beradi", "13-pinni o‘chiradi", "13-pinni kirish qiladi", "Arduino o‘chadi"], correct: 0 },
            { q: "5. digitalWrite(13, LOW); buyrug‘i nimani anglatadi?", options: ["Pin yoqiladi", "Pin o‘chiriladi", "Pin analog bo‘ladi", "Pin sensor bo‘ladi"], correct: 1 },
            { q: "6. delay(1000); buyrug‘i nimani bildiradi?", options: ["1 millisekund kutadi", "1 sekund kutadi", "10 sekund kutadi", "100 sekund kutadi"], correct: 1 },
            { q: "7. Arduino dasturida pinni kirish rejimiga o‘tkazish uchun qaysi buyruq ishlatiladi?", options: ["pinWrite()", "digitalMode()", "pinMode(pin, INPUT)", "pinHigh()"], correct: 2 },
            { q: "8. Arduino dasturida LED ni yoqish uchun qaysi buyruq ishlatiladi?", options: ["digitalWrite(pin, HIGH)", "digitalWrite(pin, LOW)", "pinMode(pin)", "delay(pin)"], correct: 0 },
            { q: "9. Arduino dasturida HIGH qiymati nimani bildiradi?", options: ["0 volt", "3 volt", "5 volt", "10 volt"], correct: 2 },
            { q: "10. Arduino dasturida LOW qiymati nimani bildiradi?", options: ["5 volt", "3 volt", "1 volt", "0 volt"], correct: 3 },
            { q: "11. Arduino dasturida Serial aloqa boshlanishi uchun qaysi buyruq yoziladi?", options: ["Serial.start()", "Serial.begin()", "Serial.write()", "Serial.read()"], correct: 1 },
            { q: "12. Serial.begin(9600); dagi 9600 nimani bildiradi?", options: ["Pin raqamini", "Xotira hajmini", "Ma’lumot uzatish tezligini (baud rate)", "Kuchlanishni"], correct: 2 },
            { q: "13. Quyidagi buyruq nima qiladi? Serial.print(25);", options: ["25 sonini Serial Monitor ga chiqaradi", "25 sonini o‘chiradi", "LED ni yoqadi", "Arduino ni o‘chiradi"], correct: 0 },
            { q: "14. Serial.println() funksiyasi Serial.print() dan nimasi bilan farq qiladi?", options: ["Yangi qatordan yozadi", "LED ni yoqadi", "Sensorni o‘chiradi", "Arduino ni o‘chiradi"], correct: 0 },
            { q: "15. Arduino IDE da Serial Monitor ni ochish uchun qaysi klavishlar ishlatiladi?", options: ["Ctrl + S", "Ctrl + Shift + M", "Ctrl + C", "Ctrl + V"], correct: 1 },
            { q: "16. Quyidagi kod nimani chiqaradi? Serial.println(\"Salom\");", options: ["Salom so‘zini chiqaradi", "LED ni yoqadi", "Arduino ni o‘chiradi", "Sensorni o‘chiradi"], correct: 0 },
            { q: "17. Serial Monitor qaysi qurilma bilan aloqa qiladi?", options: ["Kompyuter va Arduino", "Sensor va LED", "Batareya va motor", "LCD va relay"], correct: 0 },
            { q: "18. Serial Monitor ko‘pincha nima uchun ishlatiladi?", options: ["Dastur natijalarini tekshirish uchun", "Arduino ni o‘chirish uchun", "LED ni o‘zgartirish uchun", "Batareyani zaryadlash uchun"], correct: 0 },
            { q: "19. Serial.print(\"Temp=\"); buyrug‘i nima qiladi?", options: ["Temp= yozuvini Serial Monitor ga chiqaradi", "Arduino ni o‘chiradi", "Sensorni o‘chiradi", "LED ni o‘chiradi"], correct: 0 },
            { q: "20. Serial Monitor orqali foydalanuvchi nima qilishi mumkin?", options: ["Arduino ga ma’lumot yuborishi mumkin", "Arduino ni buzishi mumkin", "Arduino ni o‘chirishi mumkin", "LED ni olib tashlashi mumkin"], correct: 0 },
            { q: "21. RTClib kutubxonasi Arduino da nima uchun ishlatiladi?", options: ["Sensorlarni boshqarish uchun", "Haqiqiy vaqt moduli bilan ishlash uchun", "LED ni yoqish uchun", "Motorni boshqarish uchun"], correct: 1 },
            { q: "22. DS1307 RTC moduli Arduino bilan odatda qaysi aloqa protokoli orqali ishlaydi?", options: ["SPI", "UART", "I2C", "USB"], correct: 2 },
            { q: "23. DS1307 modulida SDA pini Arduino UNO ning qaysi piniga ulanadi?", options: ["A4", "A5", "D13", "D2"], correct: 0 },
            { q: "24. DS1307 modulida SCL pini Arduino UNO ning qaysi piniga ulanadi?", options: ["A3", "A4", "A5", "D12"], correct: 2 },
            { q: "25. DateTime now = rtc.now(); buyrug‘i nima qiladi?", options: ["RTC ni o‘chiradi", "Hozirgi vaqtni RTC modulidan o‘qiydi", "Vaqtni o‘zgartiradi", "Arduino ni o‘chiradi"], correct: 1 },
            { q: "26. Quyidagi kod nimani bildiradi? Serial.println(now.hour());", options: ["Soatni Serial monitorga chiqaradi", "Yilni chiqaradi", "Kunni chiqaradi", "Minutni chiqaradi"], correct: 0 },
            { q: "27. Quyidagi kod nimani chiqaradi? Serial.println(now.minute());", options: ["Sekundni", "Soatni", "Minutni", "Yilni"], correct: 2 },
            { q: "28. Quyidagi kod nimani chiqaradi? Serial.println(now.second());", options: ["Sekundni", "Soatni", "Kunni", "Yilni"], correct: 0 },
            { q: "29. RTC modulining asosiy vazifasi nima?", options: ["Temperatura o‘lchash", "Haqiqiy vaqtni saqlash va hisoblash", "Kuchlanishni oshirish", "Signal kuchaytirish"], correct: 1 },
            { q: "30. RTC modulida batareya nima uchun ishlatiladi?", options: ["Arduino ni ishlatish uchun", "Elektr uzilganda ham vaqtni saqlash uchun", "Sensorni ishlatish uchun", "LED ni yoqish uchun"], correct: 1 },
            { q: "31. digitalRead(pin) funksiyasi qanday ma’lumot qaytaradi?", options: ["Analog qiymatni (0–1023)", "Raqamli holatni: HIGH yoki LOW", "Pin raqamini", "Vaqtni (millisekundlarda)"], correct: 1 },
            { q: "32. digitalRead() funksiyasidan foydalanish uchun pin qanday rejimga o‘tkazilishi kerak?", options: ["OUTPUT", "INPUT yoki INPUT_PULLUP", "ANALOG", "PWM"], correct: 1 },
            { q: "34. INPUT_PULLUP rejimi qanday afzallikka ega?", options: ["Tashqi pull-up rezistor kerak emas", "Pin tezroq ishlaydi", "Analog signallarni o‘qiydi", "Faqat LOW holatni beradi"], correct: 0 },
            { q: "35. INPUT_PULLUP rejimida tugma bosilmaganda digitalRead() qanday qiymat qaytaradi?", options: ["LOW", "HIGH", "0", "1023"], correct: 1 },
            { q: "36. Tugma bosilganda (INPUT_PULLUP rejimida) odatda qanday qiymat o‘qiladi?", options: ["HIGH", "LOW", "1", "Floating"], correct: 1 },
            { q: "37. Quyidagi kod parchasi nimani anglatadi? int sensor = digitalRead(4); if (sensor == HIGH) {Serial.println(\"Motion!\"); }", options: ["Harakat yo‘q bo‘lsa xabar chiqadi", "Harakat bo‘lsa xabar chiqadi", "Har doim xabar chiqadi", "Hech qachon xabar chiqarmaydi"], correct: 1 },
            { q: "38. digitalRead() funksiyasi qaysi turdagi sensorlar bilan ko‘pincha ishlatiladi?", options: ["Faqat harorat sensorlari", "Tugma, rele, PIR motion sensor, ON/OFF datchiklar", "Faqat analog sensorlar", "Faqat ultratovush sensorlari"], correct: 1 },
            { q: "39. Pull-down rezistor qo‘yilganda tugma bosilmaganda pin qanday holatda bo‘ladi?", options: ["HIGH", "LOW", "Floating", "3.3V"], correct: 1 },
            { q: "40. Quyidagi holatlardan qaysi biri digitalRead() uchun to‘g‘ri emas?", options: ["HIGH ≈ 5V (yoki 3.3V)", "LOW ≈ 0V", "Qiymatlar 0 yoki 1 sifatida saqlanadi", "Har qanday qiymatni (masalan 512) qaytarishi mumkin"], correct: 3 },

        let currentQuestion = 0;
        let userAnswers = [];
        let userName = '';
        let groupName = '';
        let timerInterval;
        let timeLeft = 15;
        let isPaused = false;
        let optionOrder = [];
        let shuffledQuestions = [];
        const groupResults = {};

        // Theme Functions
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const toggleBtn = document.getElementById('themeToggle');
            if (theme === 'dark') {
                toggleBtn.textContent = '☀️';
            } else {
                toggleBtn.textContent = '🌙';
            }
        }

        // Initialize theme on load
        initTheme();

        function shuffleArray(array) {
            const result = array.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        window.addEventListener('load', async () => {
            await loadGroupResults();
            populateFromQuery();
            updateGroupNote();
        });

        window.addEventListener('storage', event => {
            if (event.key === 'groupResults') {
                loadGroupResults();
                updateGroupNote();
                if (document.getElementById('groupResults').style.display === 'block') {
                    displayGroupResults();
                }
            }
        });

        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());

        function choosePartScreen() {
            const name = document.getElementById('userName').value.trim();
            if (!name) {
                alert('Iltimos, ismingizni kiriting!');
                return;
            }
            userName = name;
            groupName = 'Ungrouped';
            if (!groupResults[groupName]) {
                groupResults[groupName] = [];
            }

            const currentQuestions = shuffledQuestions.length ? shuffledQuestions : questions;
            userAnswers = new Array(currentQuestions.length).fill(-1);
            optionOrder = currentQuestions.map(q => shuffleArray(q.options.map((_, index) => index)));
            currentQuestion = 0;

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('testScreen').style.display = 'block';

            showQuestion();
            startTimer();
        }

        function randomizeQuestions() {
            shuffledQuestions = shuffleArray(questions);
            document.getElementById('shuffleStatus').textContent = 'Savollar aralashdi! Testni hozir boshlang.';
        }

        function getCurrentQuestions() {
            return shuffledQuestions.length ? shuffledQuestions : questions;
        }

        function showQuestion(resetTimerOnShow = true) {
            const currentQuestions = getCurrentQuestions();
            const q = currentQuestions[currentQuestion];
            const displayQuestionNumber = currentQuestion + 1;
            const totalQuestions = currentQuestions.length;
            document.getElementById('questionNumber').textContent = `Savol ${displayQuestionNumber}/${totalQuestions}`;
            document.getElementById('questionText').textContent = q.q;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            const correctAnswer = q.correct;
            const answeredIndex = userAnswers[currentQuestion];
            const currentOrder = optionOrder[currentQuestion] || q.options.map((_, index) => index);

            currentOrder.forEach((actualIndex, displayIndex) => {
                const option = q.options[actualIndex];
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `
                    <input type="radio" name="option" value="${actualIndex}" ${answeredIndex === actualIndex ? 'checked' : ''} ${answeredIndex !== -1 || isPaused ? 'disabled' : ''}>
                    <span>${String.fromCharCode(65 + displayIndex)}) ${option}</span>
                `;
                if (answeredIndex === -1 && !isPaused) {
                    label.onclick = () => selectOption(actualIndex);
                }
                if (answeredIndex !== -1) {
                    if (actualIndex === answeredIndex) {
                        if (actualIndex === correctAnswer) {
                            label.classList.add('correct');
                        } else {
                            label.classList.add('incorrect');
                        }
                    } else if (actualIndex === correctAnswer) {
                        label.classList.add('correct');
                    }
                }
                optionsContainer.appendChild(label);
            });
            
            updateProgress();
            renderPagination();
            if (resetTimerOnShow && !isPaused) {
                resetTimer();
            }
        }

        function selectOption(index) {
            if (isPaused || userAnswers[currentQuestion] !== -1) {
                return;
            }
            const currentQuestions = getCurrentQuestions();
            const correctAnswer = currentQuestions[currentQuestion].correct;
            userAnswers[currentQuestion] = index;
            const options = document.querySelectorAll('.option');
            
            options.forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
                const input = opt.querySelector('input');
                if (input) {
                    input.disabled = true;
                    const actualIndex = Number(input.value);
                    if (actualIndex === index) {
                        if (actualIndex === correctAnswer) {
                            opt.classList.add('correct');
                        } else {
                            opt.classList.add('incorrect');
                        }
                    } else if (actualIndex === correctAnswer) {
                        opt.classList.add('correct');
                    }
                }
            });

            const totalQuestions = currentQuestions.length;
            if (index === correctAnswer) {
                setTimeout(() => {
                    if (currentQuestion < totalQuestions - 1) {
                        nextQuestion();
                    } else {
                        setTimeout(finishTest, 1000);
                    }
                }, 1800);
            } else {
                setTimeout(() => {
                    if (currentQuestion < totalQuestions - 1) {
                        nextQuestion();
                    } else {
                        setTimeout(finishTest, 3000);
                    }
                }, 5000);
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPaused) {
                clearInterval(timerInterval);
                pauseBtn.textContent = "Davom etish";
            } else {
                pauseBtn.textContent = "To'xtatish";
                startTimer();
            }
            updateProgress();
            showQuestion(false);
        }

        function nextQuestion() {
            const totalQuestions = getCurrentQuestions().length;
            if (currentQuestion < totalQuestions - 1) {
                currentQuestion++;
                showQuestion();
                resetTimer();
            } else {
                finishTest();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
                resetTimer();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
                const totalQuestions = getCurrentQuestions().length;
                if (timeLeft <= 0) {
                    if (currentQuestion < totalQuestions - 1) {
                        nextQuestion();
                    } else {
                        finishTest();
                    }
                }
            }, 1000);
        }

        function resetTimer() {
            timeLeft = 15;
            updateTimer();
        }

        function updateTimer() {
            const timerElement = document.getElementById('timer');
            timerElement.className = 'timer';
            if (isPaused) {
                timerElement.textContent = "To'xtatildi";
                timerElement.classList.add('paused');
                return;
            }
            timerElement.textContent = timeLeft;
            if (timeLeft <= 5) timerElement.classList.add('warning');
            if (timeLeft <= 2) timerElement.classList.add('danger');
        }

        function updateProgress() {
            const totalQuestions = getCurrentQuestions().length;
            const progress = ((currentQuestion + 1) / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('prevBtn').disabled = currentQuestion === 0 || isPaused;
            document.getElementById('nextBtn').disabled = currentQuestion === totalQuestions - 1 || isPaused;
        }

        function finishTest() {
            clearInterval(timerInterval);
            document.getElementById('testScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
            calculateResults();
        }

        function gotoQuestion(index) {
            const totalQuestions = getCurrentQuestions().length;
            if (index < 0 || index >= totalQuestions || isPaused) return;
            currentQuestion = index;
            showQuestion();
            resetTimer();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalQuestions = getCurrentQuestions().length;
            const maxButtons = 9;
            const right = Math.min(totalQuestions, Math.max(1, currentQuestion + 1 - 3) + maxButtons - 1);
            const start = Math.max(1, right - maxButtons + 1);

            container.innerHTML = '';

            if (start > 1) {
                const first = document.createElement('div');
                first.className = 'page-item';
                first.textContent = '1';
                first.onclick = () => gotoQuestion(0);
                container.appendChild(first);
                if (start > 2) {
                    const dots = document.createElement('div');
                    dots.className = 'page-item disabled';
                    dots.textContent = '...';
                    container.appendChild(dots);
                }
            }

            for (let i = start; i <= right; i++) {
                const item = document.createElement('div');
                item.className = 'page-item';
                if (i - 1 === currentQuestion) {
                    item.classList.add('active');
                } else {
                    item.onclick = () => gotoQuestion(i - 1);
                }
                item.textContent = i;
                container.appendChild(item);
            }

            if (right < totalQuestions) {
                if (right < totalQuestions - 1) {
                    const dots = document.createElement('div');
                    dots.className = 'page-item disabled';
                    dots.textContent = '...';
                    container.appendChild(dots);
                }
                const last = document.createElement('div');
                last.className = 'page-item';
                last.textContent = totalQuestions;
                last.onclick = () => gotoQuestion(totalQuestions - 1);
                container.appendChild(last);
            }
        }

        function calculateResults() {
            const currentQuestions = getCurrentQuestions();
            let correct = 0;
            let incorrect = 0;
            let skipped = 0;

            for (let i = 0; i < currentQuestions.length; i++) {
                const answer = userAnswers[i];
                if (answer === -1) skipped++;
                else if (answer === currentQuestions[i].correct) correct++;
                else incorrect++;
            }

            const percentage = Math.round((correct / currentQuestions.length) * 100);

            document.getElementById('userNameDisplay').textContent = `${userName} - To'liq Test`;
            document.getElementById('scoreNumber').textContent = percentage + '%';
            document.getElementById('scoreText').textContent = `${correct} / ${currentQuestions.length}`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = incorrect;
            document.getElementById('skippedCount').textContent = skipped;

            groupResults[groupName].push({
                name: userName,
                part: 'Toʻliq test',
                correct: correct,
                percentage: percentage
            });

            saveGroupResults();

            if (groupResults[groupName].length > 1) {
                displayGroupResults();
            }
        }

        async function loadGroupResults() {
            const stored = localStorage.getItem('groupResults');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed && typeof parsed === 'object') {
                        Object.keys(groupResults).forEach(key => delete groupResults[key]);
                        Object.assign(groupResults, parsed);
                    }
                } catch (error) {
                    console.warn('Group results load failed', error);
                }
            }
        }

        function saveGroupResults() {
            try {
                localStorage.setItem('groupResults', JSON.stringify(groupResults));
            } catch (error) {
                console.warn('Group results save failed', error);
            }
        }

        function displayGroupResults() {
            const groupResultsDiv = document.getElementById('groupResults');
            const table = document.getElementById('groupTable');
            
            const group = groupResults[groupName] || [];
            table.innerHTML = '<tr><th>№</th><th>Ism</th><th>Test</th><th>To\'g\'ri Javoblar</th><th>Foiz</th></tr>';
            
            group.forEach((user, index) => {
                const row = table.insertRow(-1);
                const partText = user.part || 'Toʻliq test';
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${user.name}</td>
                    <td>${partText}</td>
                    <td>${user.correct}</td>
                    <td>${user.percentage}%</td>
                `;
            });
            
            groupResultsDiv.style.display = 'block';
        }

        function updateGroupNote() {
            const note = document.getElementById('groupNote');
            const groupNames = Object.keys(groupResults);
            if (!note) return;
            if (groupNames.length === 0) {
                note.textContent = 'Guruh natijalari brauzerda saqlanadi. Yangi talaba kirishi mumkin.';
            } else {
                note.textContent = `Saqlangan guruhlar: ${groupNames.join(', ')}. Boshqa talabalar ham kirib test topshirishi mumkin.`;
            }
        }

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                name: params.get('name') || '',
                group: params.get('group') || '',
                autostart: params.get('autostart') === '1'
            };
        }

        function populateFromQuery() {
            const { name, group, autostart } = getQueryParams();
            if (group) {
                groupName = group;
                document.getElementById('shuffleStatus').textContent = `Guruh linki orqali kirdingiz: ${group}`;
            }
            if (name) {
                document.getElementById('userName').value = name;
            }
            if (autostart && name) {
                choosePartScreen();
            }
        }

        function openNewStudentPanel() {
            clearInterval(timerInterval);
            userName = '';
            groupName = '';
            timeLeft = 15;
            isPaused = false;
            document.getElementById('pauseBtn').textContent = "To'xtatish";
            document.getElementById('userName').value = '';
            document.getElementById('shuffleStatus').textContent = '';
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('testScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'none';
            updateGroupNote();
        }

        function restartTest() {
            clearInterval(timerInterval);
            const currentQuestions = getCurrentQuestions();
            currentQuestion = 0;
            userAnswers = new Array(currentQuestions.length).fill(-1);
            optionOrder = currentQuestions.map(q => shuffleArray(q.options.map((_, index) => index)));
            timeLeft = 15;
            isPaused = false;
            document.getElementById('pauseBtn').textContent = "To'xtatish";
            document.getElementById('shuffleStatus').textContent = '';
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('testScreen').style.display = 'block';
            document.getElementById('resultsScreen').style.display = 'none';
            
            showQuestion();
            startTimer();
        }
    </script>
</body>
</html>
