<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axborot Tizimi Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Kunduzgi (Light) Rejam ranglari */
        :root {
            --bg-body: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-container: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --bg-input: #ffffff;
            --border-input: #dddddd;
            --bg-question: #f8f9fa;
            --border-question: #667eea;
            --bg-option: #ffffff;
            --border-option: #dddddd;
            --bg-option-hover: #f8f9fa;
            --bg-pagination: #ffffff;
            --bg-timer: #f0f0f0;
            --bg-detail-card: #f8f9fa;
            --shadow-container: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Tungi (Dark) Rejam ranglari */
        [data-theme="dark"] {
            --bg-body: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --bg-container: #2b2b3d;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --bg-input: #3a3a50;
            --border-input: #555577;
            --bg-question: #33334d;
            --border-question: #9fa8da;
            --bg-option: #33334d;
            --border-option: #555577;
            --bg-option-hover: #3f3f5c;
            --bg-pagination: #3a3a50;
            --bg-timer: #3a3a50;
            --bg-detail-card: #33334d;
            --shadow-container: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            background: var(--bg-container);
            color: var(--text-primary);
            border-radius: 15px;
            box-shadow: var(--shadow-container);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-question);
            border: 1px solid var(--border-option);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .start-screen {
            text-align: center;
        }

        .start-screen input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid var(--border-input);
            border-radius: 8px;
            font-size: 16px;
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .start-screen input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .test-selection {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .test-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .time-input {
            width: 80px;
            padding: 12px 5px;
            border: 2px solid var(--border-input);
            border-radius: 8px;
            font-size: 16px;
            background: var(--bg-input);
            color: var(--text-primary);
            text-align: center;
            margin: 0;
        }

        .time-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .test-screen {
            display: none;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s;
        }

        .question-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
            color: var(--text-secondary);
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }

        .page-item {
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border-option);
            background: var(--bg-pagination);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
        }

        .page-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .page-item.disabled {
            opacity: 0.45;
            cursor: default;
        }

        .test-screen,
        .test-screen * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .question-timer-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            background: var(--bg-timer);
            color: var(--text-primary);
        }

        .timer.warning {
            background: #fff3cd;
            color: #856404;
        }

        .timer.danger {
            background: #f8d7da;
            color: #721c24;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding: 20px;
            background: var(--bg-question);
            border-left: 4px solid var(--border-question);
            border-radius: 8px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 15px;
            border: 2px solid var(--border-option);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--bg-option);
            color: var(--text-primary);
        }

        .option:hover {
            border-color: #667eea;
            background: var(--bg-option-hover);
        }

        .option input[type="radio"] {
            margin-right: 10px;
        }

        .option label {
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .option.selected {
            border-color: #667eea;
            background: #e8eaf6;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
            color: #b71c1c;
        }

        .buttons-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }

        .btn-small {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
        }

        .btn-small:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-screen {
            display: none;
            text-align: center;
        }

        .results-screen h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 24px;
        }

        .score-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
        }

        .score-display .score-number {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-display .score-text {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .detail-card {
            background: var(--bg-detail-card);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .detail-card.correct { border-left-color: #4caf50; }
        .detail-card.incorrect { border-left-color: #f44336; }
        .detail-card.skipped { border-left-color: #ff9800; }

        .detail-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .detail-card.correct .detail-number { color: #4caf50; }
        .detail-card.incorrect .detail-number { color: #f44336; }
        .detail-card.skipped .detail-number { color: #ff9800; }

        .detail-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .group-results {
            margin-top: 40px;
            text-align: left;
        }

        .group-results h3 {
            color: var(--text-primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .group-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }

        .group-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-option);
            color: var(--text-primary);
        }

        .group-table tr:hover {
            background: var(--bg-option-hover);
        }

        .btn-restart {
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .start-screen input[type="text"], .btn, .btn-small, .page-item, .question-timer-controls { width: 100%; }
            .page-item { min-width: 0; flex: 1 1 auto; }
            .score-details { grid-template-columns: 1fr; }
            .buttons-group { flex-direction: column; }
            .buttons-group .btn-small { width: 100%; }
            .header h1 { font-size: 22px; }
            .question-text { font-size: 16px; }
            .options { gap: 12px; }
            .option { padding: 14px; }
            .test-row { flex-direction: column; }
            .time-input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Tungi/Kunduzgi rejim">🌙</button>

        <div class="start-screen" id="startScreen">
            <div class="header">
                <h1>🎓 Test Tizimiga Xush Kelibsiz!</h1>
                <p>O'zingizga kerakli testni va vaqtni tanlang</p>
            </div>
            <div>
                <input type="text" id="userName" placeholder="Ismingizni kiriting" maxlength="50">
                
                <div class="test-selection">
                    <div class="test-row">
                        <input type="number" id="time1" class="time-input" value="40" min="5" max="999" title="1-Test uchun vaqt (soniya)">
                        <button class="btn" onclick="startSelectedTest(1)" style="flex: 1; margin:0;">1-Test: Pedagogika tarixi</button>
                    </div>
                    <div class="test-row">
                        <input type="number" id="time2" class="time-input" value="30" min="5" max="999" title="2-Test uchun vaqt (soniya)">
                        <button class="btn btn-secondary" onclick="startSelectedTest(2)" style="flex: 1; margin:0;">2-Test: Amaliy dasturlar</button>
                    </div>
                </div>

                <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn" style="flex: 1; background: #999;" onclick="randomizeQuestions()">Savollarni Aralashtirish</button>
                </div>
                
                <div id="shuffleStatus" style="margin-top: 10px; color: var(--text-secondary); font-size: 14px;"></div>
                <div id="groupNote" style="margin-top: 10px; color: var(--text-secondary); font-size: 14px;"></div>
            </div>
        </div>

        <div class="test-screen" id="testScreen">
            <div class="header">
                <h1 id="testTitle">Test</h1>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="question-info">
                <span id="questionNumber">Savol 1/100</span>
                <div class="question-timer-controls">
                    <div class="timer" id="timer">40</div>
                    <button class="btn btn-small" onclick="togglePause()" id="pauseBtn">To'xtatish</button>
                </div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="pagination" id="pagination"></div>
            <div class="buttons-group">
                <button class="btn btn-small" onclick="previousQuestion()" id="prevBtn">Oldingi</button>
                <button class="btn btn-small" onclick="restartTest()" id="restartBtn" style="background: #ff6b6b;">Qayta Boshlash</button>
                <button class="btn btn-small" onclick="nextQuestion()" id="nextBtn">Keyingi →</button>
            </div>
        </div>

        <div class="results-screen" id="resultsScreen">
            <div class="header">
                <h1>🎉 Test Yakunlandi!</h1>
            </div>
            <h2 id="userNameDisplay"></h2>
            <div class="score-display">
                <div class="score-number" id="scoreNumber">0%</div>
                <div class="score-text" id="scoreText">0 / 100</div>
            </div>
            <div class="score-details">
                <div class="detail-card correct">
                    <div class="detail-number" id="correctCount">0</div>
                    <div class="detail-label">To'g'ri Javoblar</div>
                </div>
                <div class="detail-card incorrect">
                    <div class="detail-number" id="incorrectCount">0</div>
                    <div class="detail-label">Noto'g'ri Javoblar</div>
                </div>
                <div class="detail-card skipped">
                    <div class="detail-number" id="skippedCount">0</div>
                    <div class="detail-label">O'tkazib yuborilgan</div>
                </div>
            </div>
            <div class="group-results" id="groupResults" style="display:none;">
                <h3>Guruh Natijalariga</h3>
                <table class="group-table" id="groupTable"></table>
            </div>
            <div class="buttons-group" style="justify-content: center; gap: 15px;">
                <button class="btn btn-restart" onclick="restartTest()">Testni Qayta Boshlash</button>
                <button class="btn btn-restart" onclick="openNewStudentPanel()" style="background: #4caf50;">Yangi Talaba Qo'shish</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 1-TEST SAVOLLARI (Pedagogika tarixi) =====
        const questions1 = [
            {
                q: "1. Qaysi asarda dehqonlarga nisbatan: “O‘zing bular bilan aralashgin, qo‘shilgin, tilda yaxshi so‘zla, yuzungni ochiq tut” deya ta’rif berilgan?",
                options: ["Qutadg‘u bilik", "Hayrat ul-abror", "Mahbub ul-qulub", "Hibat ul-haqoyiq"],
                correct: 0
            },
            {
                q: "2. Qaysi olim tabiatda hayot bahordan boshlangani kabi ta’lim olish jarayoni uchun eng qulay davr bolalik ekanligini ta’kidlagan?",
                options: ["Ya.A.Komenskiy", "Abdulla Avloniy", "Disterveg", "Gerbart"],
                correct: 0
            },
            {
                q: "3. Pedagogika olamiga savol – javob “Evristik” suhbat metodini olib kelgan faylasuf olim?",
                options: ["Suqrot", "Arastu", "Aflotun", "Demokrit"],
                correct: 0
            },
            {
                q: "4. “Takrorlash bilimning asosidir”. Ushbu ibora qaysi pedagogga tegishli?",
                options: ["K. D. Ushinskiy", "YA.A. Komenskiy", "A.S. Makarenko", "A.Avloniy"],
                correct: 1
            },
            {
                q: "5. Yusuf Hos Hojibning “Qutadg`u bilig” asarini chinliklar qanday nomlagan?",
                options: ["“Adab ul-mulk”", "“Anis ui mamolik”", "“Ziynal ul umaro”", "“Shohnomai turkiy”"],
                correct: 0
            },
            {
                q: "6. “Qutadg`u bilig” ma`nosi nimani anglatadi?",
                options: ["Saodatga boshlovchi bilim", "Haqiqatlar armug`oni", "Baxt-saodatga erishuv to`g`risida", "Ilmlarning kelib chiqishi"],
                correct: 0
            },
            {
                q: "7. Maktab tarixida ta‘limning mukammal jamoa shakli bo’lgan sinf-dars tizimi qachon va kim tomonidan yaratilgan?",
                options: ["XVII asr boshlarida Ya. A. Komenskiy tomonidan", "XV asrda Pestallotsi tomonidan", "XI asr oxirida Xorazmiy tonidan", "1985-yilda K. D. Ushinskiy tomonidan"],
                correct: 0
            },
            {
                q: "8. Ta’lim – tarbiyaga birinchi bo‘lib ilmiy ta’rif bergan olim?",
                options: ["Abu Nasr Farobiy", "Al – Xorazmiy", "Abdulla Avloniy", "Abu Rayhon Beruniy"],
                correct: 0
            },
            {
                q: "9. YA.Komenskiy ta’rifi bilan aytganda “Didaktikaning oltin qoidasi bu -…”",
                options: ["Ko‘rgazmalilik", "Ilmiylik", "Tushunarlilik", "Obrazlilik"],
                correct: 0
            },
            {
                q: "10. Pedagogika fani rivojlanishiga hissa qo‘shgan Sharq allomalari…",
                options: ["Abu Nasr Farobiy, Al-Xorazmiy, Abu Rayhon Beruniy", "Sa`diy Sheroziy, Mahmud G`aznaviy, Abdulqodir Bedil", "Yan Amos Komenskiy, Adolf Disterveg, Anton Makarenko", "Kaykovus, Aflotun, Davoniy"],
                correct: 0
            },
            {
                q: "11. Pedagogika rivojlanishiga hissa qo‘shgan g‘arb pedagog-olimlari...",
                options: ["Yan Amos Komenskiy, Adolf Disterveg", "Abu Nasr Farobiy, Al-Xorazmiy", "Xudoyberdi To‘xtaboev. Erkin Voxidov", "Arastu, Suqrot"],
                correct: 0
            },
            {
                q: "12. Mashhur yunon faylasufi Arastudan keyin sharqda kimni ”Muallimi soniy” – ”Ikkinchi muallim” deb ataganlar?",
                options: ["Farobiy", "Davoniy", "Navoiy", "Komenskiy"],
                correct: 0
            },
            {
                q: "13. “Fozil odamlar shahri” va “Ruhiy madaniyat haqida risola” asarlari muallifi kim?",
                options: ["Farobiy", "Davoniy", "Navoiy", "Komenskiy"],
                correct: 0
            },
            {
                q: "14. Turkiy tilda yaratilgan 1-didaktik asar",
                options: ["“Qutadg‘u bilig”", "“Turkiy guliston yoxud axloq”", "“Fozil odamlar shahri”", "“Qobusnoma”"],
                correct: 0
            },
            {
                q: "15. “Usuli jadid” maktablari uchun to‘rt qismdan iborat “Adabiyot yohud milliy she’rlar”, “Birinchi muallim”, “Turkiy guliston yohud ahloq”, “Ikkinchi muallim”, “Maktab gulistoni” kabi darslik va o‘qish kitoblarini qaysi adib yaratgan?",
                options: ["Abdulla Avloniy", "Mahmud Qoshg‘ariy", "Munavvarqori Abdurashidxonov", "Siddiq Rajabov"],
                correct: 0
            },
            {
                q: "16. Avestodagi bosh g‘oya - ...",
                options: ["Ezgu fikr, ezgu so‘z, ezgu amal", "Ozob va obod vatan, farovon turmush", "Dil ba yaru dast bakor", "Kuch – adolatda"],
                correct: 0
            },
            {
                q: "17. Arablar “daryo orti” deb atagan hudud - ?",
                options: ["Movarounnahr", "Xuroson", "Kaspiy bo‘yi", "Qashqar"],
                correct: 0
            },
            {
                q: "18. Xorazm shohi Ma’mun-2 tomonidan tashkil etilgan muassasa - ?",
                options: ["“Ma’mun akademiyasi”", "“Fanlar akademiyasi”", "“Baytul hikma”", "“Foziliya”"],
                correct: 0
            },
            {
                q: "19. Bilish nazariyasiga o‘z hissasini qo‘shgan, 1-lardan bo‘lib sinov-kuzatish va sinov metodlariga asos solgan mutafakkir ...",
                options: ["Muhammad al-Xorazmiy", "Abu Nasr Farobiy", "Abu Rayhon Beruniy", "Munis Xorazmiy"],
                correct: 2
            },
            {
                q: "20. Abu Rayhon Beruniy inson kamolotida uch narsa muhimligini ta’kidlaydi. Bular qaysilar?",
                options: ["irsiyat, muhit, tarbiya", "ota-ona, oila, jamiyat", "meros, boylik, davlat", "salomatlik, ilm, hunar"],
                correct: 0
            },
            {
                q: "21. Sharqda “Shayx ul-rais” unvoniga sazovor bo‘lgan mutafakkir -",
                options: ["Abu Ali ibn Sino", "Muhammad al-Xorazmiy", "Abu Nasr Farobiy", "Abu Rayhon Beruniy"],
                correct: 0
            },
            {
                q: "22. Mirzo Ulug‘bek qaysi shaharlarda madrasalar (oliy ta’lim muassasasi) barpo etgan?",
                options: ["Samarqand, Buxoro, G‘ijduvon", "Toshkent, Samarqand, Buxoro", "Samarqand, Buxoro, Qo‘qon", "Samarqand, Xirot, Bag‘dod"],
                correct: 0
            },
            {
                q: "23. Samarqanddagi Ulug‘bek qurdirgan madrasa peshtoqiga qanday so‘zlar bitilgan?",
                options: ["Bilimga intilish har bir mo‘min va muslima uchun farzdir", "Hatto Xitoyda bo‘lsa ham ilm izla", "Oq yo‘l, rohi safed", "Xush kelibsiz, tolibi ilmlar"],
                correct: 0
            },
            {
                q: "24. Alisher Navoiy ta’rifi bo‘yicha achchiq, ammo foyda beruvchi, qattiq, ammo zararni daf etuvchi va shodliklar kaliti nima?",
                options: ["Sabr", "Ilm", "Aql", "Donolik"],
                correct: 0
            },
            {
                q: "25. Ibrat taxallusi qaysi jadid ma’rifatparvar adibiga tegishli?",

            { q: "66. MS Excel dasturida ma'lumotlarni o'sish tartibida saralash uchun qaysi amal bajariladi?", options: ["Data menyusi → Sort → Ascending", "Format menyusi → Sort → A to Z", "Insert menyusi → Sort → Ascending", "Home menyusi → Sort → A to Z"], correct: 0 },
            { q: "67. MS Excel dasturida yacheykaga sharh (comment) qo'shish uchun qaysi menyu ishlatiladi?", options: ["Review → New Comment", "Format → Comment", "Data → Comment", "Insert → Note"], correct: 0 },
            { q: "68. Differensial tenglama tartibi nima bilan aniqlanadi?", options: ["Tenglamadagi eng yuqori tartibli hosilaning tartibi bilan", "Tenglamaning o'ng tomonidagi ifoda bilan", "Tenglamadagi noma'lumlar soni bilan", "Tenglamadagi koeffitsientlar soni bilan"], correct: 0 },
            { q: "69. Birinchi tartibli oddiy differensial tenglamaning umumiy ko'rinishi qanday?", options: ["y' = f(x, y)", "y'' = f(x, y)", "y''' = f(x)", "∫y dx = f(x)"], correct: 0 },
            { q: "70. Differensial tenglamaning xususiy yechimi nima?", options: ["Boshlang'ich shartlarni qanoatlantiruvchi yechim", "Barcha boshlang'ich shartlar uchun umumiy yechim", "Taxminiy hisoblash natijasida olingan yechim", "Faqat grafikda ifodalangan taqribiy yechim"], correct: 0 },
            { q: "71. Eyler usuli differensial tenglamalarni yechishning qaysi turi?", options: ["Sonli (taqribiy) yechish usuli", "Aniq (analitik) yechish usuli", "Matritsa orqali yechish usuli", "Grafik orqali yechish usuli"], correct: 0 },
            { q: "72. Differensial tenglamalar sistemasi deb nimaga aytiladi?", options: ["Bir necha differensial tenglamalarni o'z ichiga olgan sistema", "Algebraik tenglamalar to'plami va ularning yechimlari", "Faqat bitta differensial tenglama va uning yechimi", "Integral tenglamalar to'plami va ularning yechimlari"], correct: 0 },
            { q: "73. Koshi masalasi nima?", options: ["Boshlang'ich shartlar berilgan differensial tenglama masalasi", "Chegaraviy shartlar berilgan differensial tenglama masalasi", "Faqat aniq yechimga ega bo'lgan matematik masala", "Matritsaviy tenglama va uning yechimi masalasi"], correct: 0 },
            { q: "74. Separabel differensial tenglama qanday tenglamaga aytiladi?", options: ["O'zgaruvchilarni ikki tomonga ajratish mumkin bo'lgan tenglama", "Chiziqli bo'lmagan va murakkab ko'rinishdagi tenglama", "Ikkinchi tartibli va yuqori darajali tenglama", "Faqat sonli usullar bilan yechiladigan tenglama"], correct: 0 },
            { q: "75. Amaliy dasturlar paketi (ADP) nima uchun yaratilgan?", options: ["Muayyan sohalardagi muammolarni hal qilish uchun ixtisoslashtirilgan dasturlar", "Umumiy maqsadli operatsion tizim yaratish va boshqarish uchun", "Faqat o'yinlar uchun mo'ljallangan ko'ngilochar dasturlar", "Internet brauzerlar to'plami va tarmoq vositalari sifatida"], correct: 0 },
            { q: "76. MathCAD, MATLAB, MS Excel qaysi turkumga kiradi?", options: ["Amaliy dasturlar paketi (ADP)", "Tizim dasturlari va drayverlar", "Operatsion tizimlar va platformalar", "Antivirus dasturlari va himoya vositalari"], correct: 0 },
            { q: "77. Jadval protsessori (elektron jadval) dasturining asosiy vazifasi nima?", options: ["Jadval ko'rinishidagi ma'lumotlarni kiritish, hisoblash va tahlil qilish", "Faqat internet bilan ishlash va veb-sahifalarni ko'rsatish", "Faqat grafika bilan ishlash va rasmlar yaratish", "Faqat matn yozish va hujjatlarni formatlash"], correct: 0 }
        ];

        // Global o'zgaruvchilar
        let activeQuestions = []; 
        let currentTestTitle = '';
        let currentQuestion = 0;
        let userAnswers = [];
        let userName = '';
        let groupName = '';
        let timerInterval;
        let timeLeft = 40;
        let activeTestTimeLimit = 40; 
        let isPaused = false;
        let optionOrder = [];
        let shuffledQuestions = [];
        const groupResults = {};

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const toggleBtn = document.getElementById('themeToggle');
            toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        initTheme();

        function shuffleArray(array) {
            const result = array.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        window.addEventListener('load', async () => {
            await loadGroupResults();
            populateFromQuery();
            updateGroupNote();
        });

        window.addEventListener('storage', event => {
            if (event.key === 'groupResults') {
                loadGroupResults();
                updateGroupNote();
                if (document.getElementById('groupResults').style.display === 'block') displayGroupResults();
            }
        });

        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());

        function startSelectedTest(testNumber) {
            const name = document.getElementById('userName').value.trim();
            if (!name) { alert('Iltimos, ismingizni kiriting!'); return; }
            userName = name;
            groupName = 'Ungrouped';
            if (!groupResults[groupName]) groupResults[groupName] = [];

            const timeInputId = testNumber === 1 ? 'time1' : 'time2';
            let inputTime = parseInt(document.getElementById(timeInputId).value);
            if (isNaN(inputTime) || inputTime < 5) { alert("Vaqt kamida 5 soniyadan bo'lishi kerak!"); return; }
            activeTestTimeLimit = inputTime;

            if (testNumber === 1) { activeQuestions = questions1; currentTestTitle = "1-Test: Pedagogika tarixi"; }
            else { activeQuestions = questions2; currentTestTitle = "2-Test: Amaliy dasturlar"; }

            document.getElementById('testTitle').innerText = currentTestTitle;
            const currentQuestions = shuffledQuestions.length ? shuffledQuestions : activeQuestions;
            userAnswers = new Array(currentQuestions.length).fill(-1);
            optionOrder = currentQuestions.map(q => shuffleArray(q.options.map((_, index) => index)));
            currentQuestion = 0;

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('testScreen').style.display = 'block';
            showQuestion(); startTimer();
        }

        function randomizeQuestions() {
            if (activeQuestions.length === 0) { alert("Iltimos, avval qaysi testni topshirishni tanlang."); return; }
            shuffledQuestions = shuffleArray(activeQuestions);
            document.getElementById('shuffleStatus').textContent = 'Savollar aralashdi! Testni hozir boshlang.';
        }

        function getCurrentQuestions() { return shuffledQuestions.length ? shuffledQuestions : activeQuestions; }

        function showQuestion(resetTimerOnShow = true) {
            const currentQuestions = getCurrentQuestions();
            if(currentQuestions.length === 0) return;
            const q = currentQuestions[currentQuestion];
            document.getElementById('questionNumber').textContent = `Savol ${currentQuestion + 1}/${currentQuestions.length}`;
            document.getElementById('questionText').textContent = q.q;
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            const correctAnswer = q.correct;
            const answeredIndex = userAnswers[currentQuestion];
            const currentOrder = optionOrder[currentQuestion] || q.options.map((_, index) => index);

            currentOrder.forEach((actualIndex, displayIndex) => {
                const option = q.options[actualIndex];
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `<input type="radio" name="option" value="${actualIndex}" ${answeredIndex === actualIndex ? 'checked' : ''} ${answeredIndex !== -1 || isPaused ? 'disabled' : ''}><span>${String.fromCharCode(65 + displayIndex)}) ${option}</span>`;
                if (answeredIndex === -1 && !isPaused) label.onclick = () => selectOption(actualIndex);
                if (answeredIndex !== -1) {
                    if (actualIndex === answeredIndex) label.classList.add(actualIndex === correctAnswer ? 'correct' : 'incorrect');
                    else if (actualIndex === correctAnswer) label.classList.add('correct');
                }
                optionsContainer.appendChild(label);
            });
            updateProgress(); renderPagination();
            if (resetTimerOnShow && !isPaused) resetTimer();
        }

        function selectOption(index) {
            if (isPaused || userAnswers[currentQuestion] !== -1) return;
            const currentQuestions = getCurrentQuestions();
            const correctAnswer = currentQuestions[currentQuestion].correct;
            userAnswers[currentQuestion] = index;
            const options = document.querySelectorAll('.option');
            options.forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
                const input = opt.querySelector('input');
                if (input) {
                    input.disabled = true;
                    const actualIndex = Number(input.value);
                    if (actualIndex === index) opt.classList.add(actualIndex === correctAnswer ? 'correct' : 'incorrect');
                    else if (actualIndex === correctAnswer) opt.classList.add('correct');
                }
            });
            const totalQuestions = currentQuestions.length;
            setTimeout(() => {
                if (index === correctAnswer) { if (currentQuestion < totalQuestions - 1) nextQuestion(); else setTimeout(finishTest, 1000); }
                else { if (currentQuestion < totalQuestions - 1) nextQuestion(); else setTimeout(finishTest, 3000); }
            }, index === correctAnswer ? 1800 : 5000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPaused) { clearInterval(timerInterval); pauseBtn.textContent = "Davom etish"; }
            else { pauseBtn.textContent = "To'xtatish"; startTimer(); }
            updateProgress(); showQuestion(false);
        }

        function nextQuestion() {
            const totalQuestions = getCurrentQuestions().length;
            if (currentQuestion < totalQuestions - 1) { currentQuestion++; showQuestion(); }
            else finishTest();
        }

        function previousQuestion() { if (currentQuestion > 0) { currentQuestion--; showQuestion(); } }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--; updateTimer();
                if (timeLeft <= 0) { if (currentQuestion < getCurrentQuestions().length - 1) nextQuestion(); else finishTest(); }
            }, 1000);
        }

        function resetTimer() { timeLeft = activeTestTimeLimit; updateTimer(); }

        function updateTimer() {
            const timerElement = document.getElementById('timer');
            timerElement.className = 'timer';
            if (isPaused) { timerElement.textContent = "To'xtatildi"; timerElement.classList.add('paused'); return; }
            timerElement.textContent = timeLeft;
            if (timeLeft <= Math.round(activeTestTimeLimit * 0.2) && timeLeft > Math.round(activeTestTimeLimit * 0.1)) timerElement.classList.add('warning');
            if (timeLeft <= Math.round(activeTestTimeLimit * 0.1)) timerElement.classList.add('danger');
        }

        function updateProgress() {
            const totalQuestions = getCurrentQuestions().length;
            document.getElementById('progressFill').style.width = ((currentQuestion + 1) / totalQuestions) * 100 + '%';
            document.getElementById('prevBtn').disabled = currentQuestion === 0 || isPaused;
            document.getElementById('nextBtn').disabled = currentQuestion === totalQuestions - 1 || isPaused;
        }

        function finishTest() { clearInterval(timerInterval); document.getElementById('testScreen').style.display = 'none'; document.getElementById('resultsScreen').style.display = 'block'; calculateResults(); }

        function gotoQuestion(index) { if (index < 0 || index >= getCurrentQuestions().length || isPaused) return; currentQuestion = index; showQuestion(); }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalQuestions = getCurrentQuestions().length;
            const maxButtons = 9;
            const right = Math.min(totalQuestions, Math.max(1, currentQuestion + 1 - 3) + maxButtons - 1);
            const start = Math.max(1, right - maxButtons + 1);
            container.innerHTML = '';
            if (start > 1) { const f = document.createElement('div'); f.className = 'page-item'; f.textContent = '1'; f.onclick = () => gotoQuestion(0); container.appendChild(f); if (start > 2) { const d = document.createElement('div'); d.className = 'page-item disabled'; d.textContent = '...'; container.appendChild(d); } }
            for (let i = start; i <= right; i++) { const item = document.createElement('div'); item.className = 'page-item'; if (i - 1 === currentQuestion) item.classList.add('active'); else item.onclick = () => gotoQuestion(i - 1); item.textContent = i; container.appendChild(item); }
            if (right < totalQuestions) { if (right < totalQuestions - 1) { const d = document.createElement('div'); d.className = 'page-item disabled'; d.textContent = '...'; container.appendChild(d); } const l = document.createElement('div'); l.className = 'page-item'; l.textContent = totalQuestions; l.onclick = () => gotoQuestion(totalQuestions - 1); container.appendChild(l); }
        }

        function calculateResults() {
            const currentQuestions = getCurrentQuestions();
            let correct = 0, incorrect = 0, skipped = 0;
            for (let i = 0; i < currentQuestions.length; i++) { const a = userAnswers[i]; if (a === -1) skipped++; else if (a === currentQuestions[i].correct) correct++; else incorrect++; }
            const percentage = Math.round((correct / currentQuestions.length) * 100);
            document.getElementById('userNameDisplay').textContent = `${userName} - ${currentTestTitle}`;
            document.getElementById('scoreNumber').textContent = percentage + '%';
            document.getElementById('scoreText').textContent = `${correct} / ${currentQuestions.length}`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = incorrect;
            document.getElementById('skippedCount').textContent = skipped;
            groupResults[groupName].push({ name: userName, part: currentTestTitle, correct: correct, percentage: percentage });
            saveGroupResults();
            if (groupResults[groupName].length > 1) displayGroupResults();
        }

        async function loadGroupResults() { const s = localStorage.getItem('groupResults'); if (s) { try { const p = JSON.parse(s); if (p && typeof p === 'object') { Object.keys(groupResults).forEach(key => delete groupResults[key]); Object.assign(groupResults, p); } } catch (e) {} } }
        function saveGroupResults() { try { localStorage.setItem('groupResults', JSON.stringify(groupResults)); } catch (e) {} }

        function displayGroupResults() {
            const groupResultsDiv = document.getElementById('groupResults');
            const table = document.getElementById('groupTable');
            const group = groupResults[groupName] || [];
            table.innerHTML = '<tr><th>№</th><th>Ism</th><th>Test</th><th>To\'g\'ri Javoblar</th><th>Foiz</th></tr>';
            group.forEach((user, index) => { const row = table.insertRow(-1); row.innerHTML = `<td>${index + 1}</td><td>${user.name}</td><td>${user.part || currentTestTitle}</td><td>${user.correct}</td><td>${user.percentage}%</td>`; });
            groupResultsDiv.style.display = 'block';
        }

        function updateGroupNote() { const n = document.getElementById('groupNote'); const g = Object.keys(groupResults); if (!n) return; n.textContent = g.length === 0 ? 'Guruh natijalari brauzerda saqlanadi.' : `Saqlangan guruhlar: ${g.join(', ')}.`; }
        function getQueryParams() { const p = new URLSearchParams(window.location.search); return { name: p.get('name') || '', group: p.get('group') || '' }; }
        function populateFromQuery() { const { name, group } = getQueryParams(); if (group) { groupName = group; document.getElementById('shuffleStatus').textContent = `Guruh linki orqali kirdingiz: ${group}`; } if (name) document.getElementById('userName').value = name; }

        function openNewStudentPanel() {
            clearInterval(timerInterval); userName = ''; groupName = ''; timeLeft = activeTestTimeLimit; isPaused = false; shuffledQuestions = [];
            document.getElementById('pauseBtn').textContent = "To'xtatish"; document.getElementById('userName').value = ''; document.getElementById('shuffleStatus').textContent = '';
            document.getElementById('startScreen').style.display = 'block'; document.getElementById('testScreen').style.display = 'none'; document.getElementById('resultsScreen').style.display = 'none';
            updateGroupNote();
        }

        function restartTest() {
            clearInterval(timerInterval); const currentQuestions = getCurrentQuestions(); currentQuestion = 0; userAnswers = new Array(currentQuestions.length).fill(-1);
            optionOrder = currentQuestions.map(q => shuffleArray(q.options.map((_, index) => index))); isPaused = false; document.getElementById('pauseBtn').textContent = "To'xtatish";
            document.getElementById('startScreen').style.display = 'none'; document.getElementById('testScreen').style.display = 'block'; document.getElementById('resultsScreen').style.display = 'none';
            showQuestion(); startTimer();
        }
    </script>
</body>
</html>
