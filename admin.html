<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Test Tizimi</title>
    <style>
        /* ===== ASOSIY STILAR ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        :root {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --border-color: #eeeeee;
            --hover-bg: #f8f9fa;
            --modal-bg: rgba(0,0,0,0.85);
        }

        [data-theme="dark"] {
            --bg-body: #121220;
            --bg-container: #1e1e30;
            --text-primary: #dfe6e9;
            --text-secondary: #b2bec3;
            --border-color: #333355;
            --hover-bg: #2a2a45;
            --modal-bg: rgba(0,0,0,0.9);
        }

        body { background: var(--bg-body); color: var(--text-primary); min-height: 100vh; transition: background 0.3s, color 0.3s; }
        
        .admin-header { background: linear-gradient(135deg, #2d3436 0%, #000000 100%); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .admin-header h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .header-buttons { display: flex; gap: 10px; align-items: center; }
        
        .admin-container { display: flex; height: calc(100vh - 70px); }
        .sidebar { width: 300px; background: var(--bg-container); padding: 20px; border-right: 1px solid var(--border-color); overflow-y: auto; transition: background 0.3s; }
        .sidebar h3 { margin-bottom: 15px; color: var(--text-secondary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .group-item { padding: 12px 15px; margin-bottom: 8px; background: var(--hover-bg); border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid transparent; color: var(--text-primary); }
        .group-item:hover { background: #eef2ff; border-left-color: #6c5ce7; }
        .group-item.active { background: #6c5ce7; color: white; border-left-color: #2d3436; }
        .group-count { background: rgba(0,0,0,0.1); padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-body); transition: background 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-container); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; transition: background 0.3s; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; }
        .bg-purple { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .bg-green { background: linear-gradient(135deg, #00b894, #55efc4); }
        .stat-info h2 { font-size: 24px; margin-bottom: 5px; }
        .stat-info p { color: var(--text-secondary); font-size: 14px; }

        .panel { background: var(--bg-container); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; transition: background 0.3s; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .panel-header h2 { font-size: 20px; color: var(--text-primary); }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { background: var(--hover-bg); padding: 12px 15px; text-align: left; font-size: 14px; color: var(--text-secondary); }
        .data-table td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
        .data-table tr:hover { background: var(--hover-bg); }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-success { background: #e6f9ee; color: #00b894; }
        .badge-warning { background: #fff8e6; color: #fdcb6e; }
        .badge-danger { background: #ffeaea; color: #d63031; }

        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-danger { background: #d63031; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-blue { background: #0984e3; color: white; }
        .btn-blue:hover { background: #074f82; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; }
        .btn-outline:hover { border-color: white; }

        .empty-state { text-align: center; padding: 30px; color: var(--text-secondary); }

        /* ===== LOGIN MODAL ===== */
        .login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--modal-bg); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: var(--bg-container); padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); color: var(--text-primary); }
        .login-box h2 { margin-bottom: 10px; }
        .login-box p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--border-color); border-radius: 8px; text-align: center; font-size: 16px; background: var(--bg-container); color: var(--text-primary); }

        /* ===== BATAFSIL MODAL ===== */
        .detail-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--modal-bg); display: none; justify-content: center; align-items: flex-start; padding-top: 50px; z-index: 200; overflow-y: auto; }
        .detail-content { background: var(--bg-container); width: 90%; max-width: 800px; border-radius: 12px; padding: 30px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 50px; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: var(--text-secondary); font-weight: bold; }
        .close-modal:hover { color: #d63031; }
        .detail-stats { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .d-stat { flex: 1; min-width: 120px; padding: 15px; border-radius: 8px; text-align: center; color: white; }
        .d-stat h3 { font-size: 28px; margin-bottom: 5px; }
        .d-stat p { font-size: 13px; opacity: 0.9; }
        .bg-correct { background: #00b894; }
        .bg-incorrect { background: #d63031; }
        .bg-skipped { background: #636e72; }
        
        .detail-question { padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--hover-bg); }
        .dq-title { font-weight: bold; margin-bottom: 10px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .dq-options { display: flex; flex-direction: column; gap: 5px; }
        .dq-opt { padding: 8px 12px; border-radius: 6px; font-size: 14px; border: 1px solid var(--border-color); background: var(--bg-container); }
        .dq-opt.was-correct { background: #e6f9ee; border-color: #00b894; color: #00b894; font-weight: bold; }
        .dq-opt.was-incorrect { background: #ffeaea; border-color: #d63031; color: #d63031; text-decoration: line-through; }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.3s; color: white; }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); transform: rotate(20deg); }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-overlay">
        <div class="login-box">
            <h2>🛡️ Admin Panel</h2>
            <p>Davom etish uchun parolni kiriting</p>
            <input type="password" id="adminPassInput" placeholder="Parol..." onkeypress="if(event.key==='Enter')checkAdminLogin()">
            <button class="btn btn-danger" style="width:100%; padding:12px; font-size:16px;" onclick="checkAdminLogin()">Tizimga kirish</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="admin-header">
        <h1>🎓 Test Tizimi Boshqaruvi</h1>
        <div class="header-buttons">
            <button class="theme-toggle" onclick="toggleTheme()" title="Tungi/Kunduzgi rejim">🌙</button>
            <a href="index.html" class="btn btn-outline">🏠 Bosh sahifa</a>
            <button class="btn btn-blue" onclick="refreshDashboard()">🔄 Yangilash</button>
            <button class="btn btn-danger" onclick="logOut()">🔓 Chiqish</button>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="admin-container">
        <aside class="sidebar">
            <h3>Guruhlar ro'yxati</h3>
            <div id="groupList"></div>
        </aside>

        <main class="main-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon bg-purple">👥</div>
                    <div class="stat-info"><h2 id="statTotalStudents">0</h2><p>Jami o'quvchilar</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-green">🏆</div>
                    <div class="stat-info"><h2 id="statTotalGroups">0</h2><p>Jami guruhlar</p></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 id="panelTitle">Barcha natijalar</h2>
                    <button class="btn btn-danger btn-sm" id="deleteGroupBtn" style="display:none;" onclick="deleteSelectedGroup()">Guruhni o'chirish 🗑️</button>
                </div>
                <table class="data-table">
                    <thead><tr><th>№</th><th>Ism</th><th>Test turi</th><th>Foiz (%)</th><th>Batafsil</th><th>O'chirish</th></tr></thead>
                    <tbody id="resultsBody"><tr><td colspan="6" class="empty-state">👈 Chap tomondan guruhni tanlang</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- BATAFSIL MODAL -->
    <div id="detailModal" class="detail-modal">
        <div class="detail-content">
            <span class="close-modal" onclick="closeDetailModal()">✕</span>
            <h2 id="detailTitle" style="margin-bottom:20px;">📊 Natijalar batafsil</h2>
            <div class="detail-stats" id="detailStats"></div>
            <div id="detailQuestions"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123"; // ADMIN PAROLI
        // Test savollari (Test faylidagi bilan bir xil bo'lishi kerak!)
        const questions1 = [ { q: "1. Pedagogika fanining asosiy ob'ekti nima?", options: ["O'quvchi shaxsi", "O'qituvchi", "Darslik", "Maktab"], correct: 0 } ];
        const questions2 = [ { q: "1. Axborot tizimi nima?", options: ["Ma'lumotlarni yig'ish tizimi", "Faqat kompyuter tarmog'i", "O'chirish tizimi", "Dasturiy ta'minot"], correct: 0 } ];

        let selectedGroup = null;

        // Theme
        function initTheme() {
            const savedTheme = localStorage.getItem('admin_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('admin_theme', next);
            updateThemeIcon(next);
        }
        function updateThemeIcon(theme) { document.querySelector('.theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙'; }
        initTheme();

        // Login Logic
        window.onload = function() {
            if(sessionStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('loginScreen').style.display = 'none';
                loadDashboard();
            }
        };
        function checkAdminLogin() {
            if(document.getElementById('adminPassInput').value === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('loginScreen').style.display = 'none';
                loadDashboard();
            } else { alert("Parol noto'g'ri!"); document.getElementById('adminPassInput').value = ''; }
        }
        function logOut() {
            if(confirm("Tizimdan chiqmoqchimisiz?")) { sessionStorage.removeItem('adminLoggedIn'); location.reload(); }
        }

        // Data Logic
        function getData() { return JSON.parse(localStorage.getItem('results') || '{}'); }
        function saveData(data) { localStorage.setItem('results', JSON.stringify(data)); }
        function refreshDashboard() { loadDashboard(); if(selectedGroup) selectGroup(selectedGroup, document.querySelector('.group-item.active')); }

        function loadDashboard() {
            let data = getData(); let totalStudents = 0; let totalGroups = Object.keys(data).length;
            const container = document.getElementById('groupList'); container.innerHTML = '';
            if(totalGroups === 0) { container.innerHTML = '<div class="empty-state" style="padding:20px;">Hali guruhlar yo\'q</div>'; } 
            else {
                for(let group in data) {
                    let count = Object.keys(data[group]).length; totalStudents += count;
                    const div = document.createElement('div');
                    div.className = `group-item ${selectedGroup === group ? 'active' : ''}`;
                    div.innerHTML = `<span><b>${group}</b></span> <span class="group-count">${count}</span>`;
                    div.onclick = function() { selectGroup(group, this); };
                    container.appendChild(div);
                }
            }
            document.getElementById('statTotalStudents').innerText = totalStudents;
            document.getElementById('statTotalGroups').innerText = totalGroups;
        }

        function selectGroup(groupName, element) {
            selectedGroup = groupName;
            document.getElementById('panelTitle').innerText = `${groupName} guruhining natijalari`;
            document.getElementById('deleteGroupBtn').style.display = 'inline-block';
            let data = getData(); const tbody = document.getElementById('resultsBody'); tbody.innerHTML = '';
            if(!data[groupName] || Object.keys(data[groupName]).length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Natijalar topilmadi</td></tr>'; return; }
            let arr = Object.entries(data[groupName]).map(([key, val]) => ({id: key, ...val}));
            arr.sort((a,b) => b.percent - a.percent);
            arr.forEach((item, idx) => {
                let badgeClass = item.percent >= 70 ? 'badge-success' : (item.percent >= 40 ? 'badge-warning' : 'badge-danger');
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx+1}</td>
                    <td><b>${item.name}</b></td>
                    <td>${item.test}</td>
                    <td><span class="badge ${badgeClass}">${item.percent}%</span></td>
                    <td><button class="btn btn-blue btn-sm" onclick='showDetail(${JSON.stringify(item).replace(/'/g, "&#39;")})'>📊 Batafsil</button></td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteResult('${groupName}', '${item.id}')">O'chirish</button></td>
                `;
                tbody.appendChild(tr);
            });
            document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        // ===== BATAFSIL KO'RISH LOGIKASI =====
        function showDetail(resultItem) {
            const modal = document.getElementById('detailModal');
            document.getElementById('detailTitle').innerText = `📊 ${resultItem.name} natijalari (${resultItem.test})`;
            
            // Statistikani chiqarish
            let correctCount = resultItem.correctCount || 0;
            let totalQ = resultItem.answers ? resultItem.answers.length : 0;
            let incorrectCount = totalQ - correctCount;
            
            document.getElementById('detailStats').innerHTML = `
                <div class="d-stat bg-correct"><h3>${correctCount}</h3><p>To'g'ri javob</p></div>
                <div class="d-stat bg-incorrect"><h3>${incorrectCount}</h3><p>Noto'g'ri javob</p></div>
                <div class="d-stat bg-skipped"><h3>${totalQ}</h3><p>Jami savollar</p></div>
            `;

            // Savollarni chiqarish
            const questions = resultItem.test === "Pedagogika" ? questions1 : questions2;
            const answers = resultItem.answers || []; // O'quvchi javoblari massivi
            const qContainer = document.getElementById('detailQuestions');
            qContainer.innerHTML = '';

            if(answers.length === 0) {
                qContainer.innerHTML = '<p style="color:red;">Eslatma: Bu test eski versiyada ishlangan, shuning uchun batafsil javoblar saqlanmagan.</p>';
            } else {
                answers.forEach((ans, idx) => {
                    const qData = questions[idx];
                    if(!qData) return;

                    let isCorrect = ans === qData.correct;
                    let statusIcon = isCorrect ? '✅' : '❌';
                    
                    let optionsHtml = '';
                    qData.options.forEach((opt, optIdx) => {
                        let optClass = 'dq-opt';
                        if(optIdx === qData.correct) optClass += ' was-correct'; // To'g'ri javob (yashil)
                        if(optIdx === ans && !isCorrect) optClass += ' was-incorrect'; // Noto'g'ri tanlangan (qizil)
                        optionsHtml += `<div class="${optClass}">${String.fromCharCode(65+optIdx)}) ${opt}</div>`;
                    });

                    qContainer.innerHTML += `
                        <div class="detail-question">
                            <div class="dq-title">${statusIcon} ${qData.q}</div>
                            <div class="dq-options">${optionsHtml}</div>
                        </div>
                    `;
                });
            }
            modal.style.display = 'flex';
        }

        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }
        window.onclick = function(event) { if(event.target == document.getElementById('detailModal')) closeDetailModal(); }

        // Delete Logic
        function deleteResult(group, id) {
            if(confirm("Haqiqatanam bu natijani o'chirmoqchimisiz?")) {
                let data = getData(); delete data[group][id];
                if(Object.keys(data[group]).length === 0) delete data[group];
                saveData(data); loadDashboard();
                if(data[group]) document.querySelector('.group-item.active')?.click();
                else { selectedGroup = null; document.getElementById('panelTitle').innerText = "Barcha natijalar"; document.getElementById('deleteGroupBtn').style.display = 'none'; document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" class="empty-state">Natija o\'chirildi</td></tr>'; }
            }
        }
        function deleteSelectedGroup() {
            if(confirm(`${selectedGroup} guruhining BUTUN NATIJALARINI o'chirmoqchimisiz?`)) {
                let data = getData(); delete data[selectedGroup]; saveData(data); selectedGroup = null;
                document.getElementById('panelTitle').innerText = "Barcha natijalar"; document.getElementById('deleteGroupBtn').style.display = 'none';
                document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" class="empty-state">Guruh o\'chirildi</td></tr>'; loadDashboard();
            }
        }
    </script>
</body>
</html>
